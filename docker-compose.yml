version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ogamex-postgres
    environment:
      POSTGRES_USER: ogamex
      POSTGRES_PASSWORD: ogamex_secret
      POSTGRES_DB: ogamex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogamex"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ogamex-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ogamex
      DATABASE_PASSWORD: ogamex_secret
      DATABASE_NAME: ogamex
      SERVER_PORT: 8080
      UNIVERSE_SPEED: 1
      ECONOMY_SPEED: 1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
